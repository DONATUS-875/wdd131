<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product review form for submitting a review of  selected product.">
    <meta name="author" content="Ahule Tertindi Donatus">
    <title>Product Review | WDD 131</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
    rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html">
            <label for="product">
                Product Name <span class="required">*</span>
            </label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>
            <fieldset>
                <legend>
                    Overall Rating <span class="required">*</span>
                </legend>
                <div class="rating">
                  <div class="rating-option">
                    <label for="rating1">&#9734;</label>
                    <input type="radio" id="rating1" name="rating" value="1" required>
                </div>
                  
                <div class="rating-option">
                    <label for="rating2">&#9734;&#9734;</label>
                    <input type="radio" id="rating2" name="rating" value="2" required>
                </div>
    
                  <div class="rating-option">
                    <label for="rating3">&#9734;&#9734;&#9734;</label>
                    <input type="radio" id="rating3" name="rating" value="3" required>
                </div>
                    
                  <div class="rating-option">
                    <label for="rating4">&#9734;&#9734;&#9734;&#9734;</label>
                    <input type="radio" id="rating4" name="rating" value="4" required>
                </div>
                    
                  <div class="rating-option">
                    <label for="rating5">&#9734;&#9734;&#9734;&#9734;&#9734;</label>
                    <input type="radio" id="rating5" name="rating" value="5" required>
                </div>
                </div>
            </fieldset>
            <label for="installation-date">
                Date of Installation <span class="required">*</span>
            </label>
            <input type="date" id="installation-date" name="installation-date" required>
            <fieldset>
                <legend>Which features did you find useful in the product?</legend>
                <p>Check all that apply.</p>
                <label for="durability">
                    <input type="checkbox" id="durability" name="features" value="Durability">
                    Durability
                </label>
                <label for="ease-of-use">
                    <input type="checkbox" id="ease-of-use" name="features" value="Ease-of-Use">
                    Ease of Use
                </label>
                <label for="performance">
                    <input type="checkbox" id="performance" name="features" value="Performance">
                    Performance
                </label>
                <label for="design">
                    <input type="checkbox" id="design" name="features" value="Design">
                    Design
                </label>            
            </fieldset>
            <label for="written-review">
                Written Review (Optional) 
            </label>
            <textarea id="written-review" name="written-review" rows="6" cols="40"></textarea>
            <label for="user-name">
                Your Name (Optional)
            </label>
            <input type="text" id="user-name" name="user-name">
            <input type="submit" value="Post Review">
        </form>
    </main>
    <footer>
        <p>
            &copy; <span id="currentyear"></span> | Ahule Tertindi Donatus | WDD 131
        </p>
        <p>
            Last Modification: <span id="lastModified"></span>
        </p>
    </footer>
</body>
</html>
